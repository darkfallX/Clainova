name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/verify-run.mjs
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clainova .
      # Boots the image in rehearsal mode and loads the first page.
      - run: |
          docker run -d --name app --network host -e MODE=rehearsal -e PORT=4173 clainova
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4173/ && exit 0; sleep 1; done
          docker logs app
          exit 1
  # Redeploys the public demo on Render after every push to main that passes
  # both jobs. The deploy hook is a secret URL kept in the repository's
  # Actions secrets as RENDER_DEPLOY_HOOK; without it this step does nothing.
  deploy:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No RENDER_DEPLOY_HOOK secret, skipping the deploy."; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -X POST "$HOOK" > /dev/null
          echo "Render deploy started."
